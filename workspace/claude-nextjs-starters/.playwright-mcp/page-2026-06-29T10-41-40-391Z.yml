            - code [ref=e64]: "// react-hook-form + Zod v4 연동 패턴 \"use client\"; import { zodResolver } from \"@hookform/resolvers/zod\"; import { useForm } from \"react-hook-form\"; import { z } from \"zod\"; import { toast } from \"sonner\"; import { Form, FormControl, FormDescription, FormField, FormItem, FormLabel, FormMessage, } from \"@/components/ui/form\"; import { Input } from \"@/components/ui/input\"; import { Button } from \"@/components/ui/button\"; // 1. Zod 스키마 정의 // - required_error 제거됨 (Zod v4) // - .default() 대신 defaultValues 사용 const schema = z.object({ name: z.string().min(2, \"이름은 2자 이상 입력하세요.\").max(50), email: z.string().email(\"올바른 이메일 주소를 입력하세요.\"), role: z.string().min(1, \"역할을 선택하세요.\"), notifications: z.boolean(), terms: z.boolean().refine((v) => v === true, { message: \"이용약관에 동의해야 합니다.\", }), }); type FormValues = z.infer<typeof schema>; // 2. useForm 설정 const form = useForm<FormValues>({ resolver: zodResolver(schema), defaultValues: { // .default()를 스키마에 쓰지 말고 여기서 처리 name: \"\", email: \"\", role: \"\", notifications: true, terms: false, }, }); // 3. 제출 핸들러 function onSubmit(values: FormValues) { toast.success(\"제출 완료!\"); console.log(values); } // 4. FormField 패턴 <Form {...form}> <form onSubmit={form.handleSubmit(onSubmit)}> <FormField control={form.control} name=\"name\" render={({ field }) => ( <FormItem> <FormLabel>이름</FormLabel> <FormControl> <Input placeholder=\"홍길동\" {...field} /> </FormControl> <FormMessage /> {/* 유효성 검사 오류 자동 표시 */} </FormItem> )} /> <Button type=\"submit\">제출하기</Button> </form> </Form>"
