            - code [ref=e91]: "// ISR (Incremental Static Regeneration) — 정적 생성 + 주기적 재검증 // 방법 1: fetch revalidate 옵션 const data = await fetch(url, { next: { revalidate: 60 }, // 60초마다 재검증 }); // 방법 2: 세그먼트 설정 export const revalidate = 3600; // 1시간 (페이지 전체 적용) export const dynamic = \"force-static\"; // 항상 정적 생성 // 방법 3: On-Demand ISR (특정 이벤트에 캐시 무효화) // app/api/revalidate/route.ts import { revalidatePath, revalidateTag } from \"next/cache\"; import { NextRequest } from \"next/server\"; export async function POST(req: NextRequest) { const { path, tag } = await req.json(); if (path) revalidatePath(path); // 특정 경로 무효화 if (tag) revalidateTag(tag); // fetch 태그 무효화 return Response.json({ revalidated: true }); }"
