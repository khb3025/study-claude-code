<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8" />
<title>슬라이드 덱 제목</title>
<link rel="stylesheet" href="deck-engine.css" />
<style>
  /* ============================================================
     이 슬라이드 덱 전용 스타일만 여기에 추가한다.
     공통 규칙(좌표계, 테마 변수, 타이포 스케일)은 deck-engine.css가 제공한다.
     ============================================================ */

  /* 슬라이드별 그리드 레이아웃 예시 */
  .layout-title-body {
    display: grid;
    grid-template-rows: auto 1fr;
    gap: 20px;
    height: 100%;
    position: relative;
    z-index: 1;
  }
  .decor-bg {
    position: absolute; top: -90px; right: -90px;
    width: 280px; height: 280px; border-radius: 50%;
    background: var(--color-accent-bg); z-index: 0;
  }
</style>
</head>
<body>

<button class="theme-toggle" onclick="togglePptTheme()">테마 전환</button>
<button class="fullscreen-toggle" onclick="toggleFullscreen()">전체화면 (F5)</button>
<div class="progress" id="progress"></div>
<div class="nav-hint">← → 방향키로 이동 · F5 전체화면 (<span id="pageIndicator">1 / N</span>)</div>

<div class="viewport">
<div class="deck" id="deck">

  <!-- 슬라이드 1: 타이틀 -->
  <section class="slide active">
    <div class="decor-bg"></div>
    <div class="layout-title-body">
      <div>
        <p class="kicker">Kicker Text</p>
        <h1>슬라이드 덱 제목을 입력하세요</h1>
        <p class="subtitle">부제목 / 발표자 / 날짜</p>
      </div>
    </div>
  </section>

  <!-- 슬라이드 2: 본문 예시 -->
  <section class="slide">
    <div class="decor-bg"></div>
    <p class="kicker">Section</p>
    <h1 style="font-size:28pt;">본문 슬라이드 제목</h1>
    <p class="subtitle">부제목 설명</p>
    <ul>
      <li>본문 내용 1</li>
      <li>본문 내용 2</li>
      <li>본문 내용 3</li>
    </ul>
  </section>

</div>
</div>

<script src="deck-engine.js"></script>
</body>
</html>
