<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center">
  <div class="bg-white rounded-2xl shadow-lg p-10 flex flex-col items-center gap-8 w-72">
    <h1 class="text-2xl font-bold text-slate-700">Counter</h1>

    <!-- Count Display -->
    <div id="count" class="text-7xl font-extrabold text-blue-600 w-36 text-center tabular-nums">0</div>

    <!-- +1 / -1 Buttons -->
    <div class="flex gap-4 w-full">
      <button onclick="update(-1)"
        class="flex-1 py-3 rounded-xl bg-blue-100 text-blue-700 font-bold text-xl hover:bg-blue-200 active:scale-95 transition-all">
        −1
      </button>
      <button onclick="update(1)"
        class="flex-1 py-3 rounded-xl bg-blue-600 text-white font-bold text-xl hover:bg-blue-700 active:scale-95 transition-all">
        +1
      </button>
    </div>

    <!-- Reset Button -->
    <button onclick="reset()"
      class="w-full py-2.5 rounded-xl border-2 border-blue-300 text-blue-500 font-semibold hover:bg-blue-50 active:scale-95 transition-all">
      Reset
    </button>
  </div>

  <script>
    let count = 0;
    const display = document.getElementById('count');

    /** count를 delta만큼 변경하고 화면 갱신 */
    function update(delta) {
      count += delta;
      render();
    }

    /** count를 0으로 초기화 */
    function reset() {
      count = 0;
      render();
    }

    /** 현재 count를 DOM에 반영하고 음수일 때 색상 변경 */
    function render() {
      display.textContent = count;
      display.className = `text-7xl font-extrabold w-36 text-center tabular-nums ${
        count < 0 ? 'text-red-500' : 'text-blue-600'
      }`;
    }
  </script>
</body>
</html>
